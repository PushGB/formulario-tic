name: Compilar Aplicación macOS, Windows y Android (APK)

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: Compilar Instalador macOS (.dmg)
    runs-on: macos-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - name: Descargar Código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Dependencias
        run: npm install

      - name: Compilar Instalador macOS (.dmg y .zip)
        run: npm run dist:mac

      - name: Subir Instaladores de Mac
        uses: actions/upload-artifact@v4
        with:
          name: Formulario-TIC-macOS
          path: dist/*.dmg

  build-windows:
    name: Compilar Instalador Windows (.exe)
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - name: Descargar Código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Dependencias
        run: npm install

      - name: Compilar Instaladores Windows (.exe y Portable)
        run: npm run dist

      - name: Subir Instaladores de Windows
        uses: actions/upload-artifact@v4
        with:
          name: Formulario-TIC-Windows
          path: dist/*.exe

  build-android:
    name: Compilar APK Android
    runs-on: ubuntu-latest
    steps:
      - name: Descargar Código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Instalar Dependencias
        run: npm install

      - name: Sincronizar Capacitor Android
        run: npm run build:android

      - name: Compilar APK con Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Renombrar APK
        run: |
          mkdir -p dist_apk
          cp android/app/build/outputs/apk/debug/app-debug.apk dist_apk/Formulario_TIC_ISP_v5.7.0.apk

      - name: Subir Instalador Android (APK)
        uses: actions/upload-artifact@v4
        with:
          name: Formulario-TIC-Android-APK
          path: dist_apk/Formulario_TIC_ISP_v5.7.0.apk

  publish-release:
    name: Publicar Release Oficial Multiplataforma
    needs: [build-macos, build-windows, build-android]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Descargar Código
        uses: actions/checkout@v4

      - name: Descargar Artefactos macOS
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: Formulario-TIC-macOS
          path: release_assets/

      - name: Descargar Artefactos Windows
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: Formulario-TIC-Windows
          path: release_assets/

      - name: Descargar Artefactos Android
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: Formulario-TIC-Android-APK
          path: release_assets/

      - name: Crear GitHub Release
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v5.7.0
          name: "Formulario TIC - ISP v5.7.0 (Android APK, Windows y macOS)"
          body: |
            ## 🚀 Instaladores Oficiales Formulario TIC - ISP v5.7.0
            
            Descarga el instalador correspondiente para tu dispositivo:
            - 🤖 **Android (APK):** `Formulario_TIC_ISP_v5.7.0.apk`
            - 🪟 **Windows Instalador (Setup):** `Formulario TIC - ISP Setup 5.7.0.exe`
            - 🪟 **Windows Portable:** `Formulario_TIC_ISP_Portable_v5.7.0.exe`
            - 🍏 **macOS:** `Formulario_TIC_ISP_macOS_v5.7.0.dmg`
            
            🌐 **Acceso Web en Vivo:** https://formulario-tic.vercel.app/
          files: release_assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

