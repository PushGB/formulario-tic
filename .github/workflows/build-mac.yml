name: Compilar Aplicación macOS, Windows y Android (APK)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Descargar Código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar Dependencias
        run: npm ci

      - name: Compilar Instalador macOS (.dmg y .zip)
        run: npm run dist:mac

      - name: Subir Instaladores de Mac
        uses: actions/upload-artifact@v4
        with:
          name: Formulario-TIC-macOS
          path: dist/*.dmg

  build-windows:
    runs-on: windows-latest
    steps:
      - name: Descargar Código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar Dependencias
        run: npm ci

      - name: Compilar Instaladores Windows (.exe y Portable)
        run: npm run dist

      - name: Subir Instaladores de Windows
        uses: actions/upload-artifact@v4
        with:
          name: Formulario-TIC-Windows
          path: dist/*.exe

  build-android:
    name: Compilar APK Android
    runs-on: ubuntu-latest
    steps:
      - name: Descargar Código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Configurar Android SDK
        uses: android-actions/setup-android@v3

      - name: Instalar Dependencias
        run: npm ci

      - name: Sincronizar Capacitor Android
        run: npm run build:android

      - name: Compilar APK con Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Renombrar APK
        run: |
          mkdir -p dist_apk
          cp android/app/build/outputs/apk/debug/app-debug.apk dist_apk/Formulario_TIC_ISP_v5.7.0.apk

      - name: Subir Instalador Android (APK)
        uses: actions/upload-artifact@v4
        with:
          name: Formulario-TIC-Android-APK
          path: dist_apk/Formulario_TIC_ISP_v5.7.0.apk

